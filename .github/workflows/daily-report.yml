name: daily-report
on:
  schedule:
    - cron: '0 22 * * *' # 06:00 Asia/Taipei
  workflow_dispatch:
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run report:daily
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          GSC_SITE: ${{ vars.GSC_SITE }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
      - name: Commit report
        run: |
          git config user.name "report-bot"
          git config user.email "report-bot@users.noreply.github.com"
          git add reports
          git commit -m "report: $(date -u +%F)" || echo "no changes"
          git push
